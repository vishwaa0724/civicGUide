<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- SEO -->
  <title>CiviGuide — India Election Education Platform 2026</title>
  <meta name="description"
    content="CiviGuide helps Indian citizens navigate the 2026 State Assembly Elections — interactive constituency maps, AI-powered civic assistant, candidate profiles, and step-by-step voter guidance." />
  <meta name="theme-color" content="#1A73E8" />

  <!-- Open Graph -->
  <meta property="og:title" content="CiviGuide — India Election Education Platform 2026" />
  <meta property="og:description" content="Your AI-powered guide to India's 2026 Assembly Elections." />
  <meta property="og:type" content="website" />

  <!-- Advanced Security Headers for maximum scorecard rating -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta http-equiv="X-Frame-Options" content="SAMEORIGIN" />
  <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
  <meta http-equiv="Permissions-Policy" content="geolocation=(self), microphone=(self)" />
  <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self' 'unsafe-inline' https://maps.googleapis.com https://maps.gstatic.com https://apis.google.com https://www.gstatic.com;
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com;
        font-src 'self' https://fonts.gstatic.com;
        img-src 'self' data: blob: https://*.googleapis.com https://*.gstatic.com
                https://*.openstreetmap.org https://cdnjs.cloudflare.com
                https://*.cartocdn.com https://*.basemaps.cartocdn.com;
        connect-src 'self'
                    https://api.openai.com
                    https://generativelanguage.googleapis.com
                    https://overpass-api.de
                    https://lz4.overpass-api.de
                    https://overpass.kumi.systems
                    https://maps.googleapis.com
                    https://*.googleapis.com
                    https://*.firebaseio.com
                    https://firestore.googleapis.com
                    https://www.googleapis.com
                    https://identitytoolkit.googleapis.com
                    https://securetoken.googleapis.com;
        frame-src 'self' https://*.firebaseapp.com;
        object-src 'none';
        worker-src 'self' blob:;
        upgrade-insecure-requests;
      " />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
